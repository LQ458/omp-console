name: Release

# A pushed `v<version>` tag builds the desktop apps and creates a draft GitHub
# release with them; a maintainer reviews and publishes the draft. A manual run
# builds the same packages as workflow artifacts without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read and check the app version
        id: version
        run: |
          version=$(jq -r .version apps/mac/tauri.conf.json)
          cargo_version=$(awk -F'"' '$1 ~ /^version = / { print $2; exit }' apps/mac/Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "tauri.conf.json version $version differs from Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ ! -f "docs/releases/v$version.md" ]; then
            echo "missing release notes docs/releases/v$version.md" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mac/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('apps/mac/Cargo.lock', 'apps/mac/rust-toolchain.toml') }}

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev pkg-config wget

      - name: Install Tauri CLI
        working-directory: apps/mac
        run: cargo install tauri-cli --locked --version '^2'

      - name: Build Linux bundles
        working-directory: apps/mac
        run: cargo tauri build --config tauri.linux.conf.json --bundles deb,appimage

      - name: Stage Linux packages
        # Tauri names bundles after the product name "omp console"; release assets get space-free names.
        run: |
          mkdir -p artifacts
          for file in apps/mac/target/release/bundle/deb/*.deb apps/mac/target/release/bundle/appimage/*.AppImage; do
            name=$(basename "$file")
            cp "$file" "artifacts/${name// /-}"
          done
          ls -l artifacts

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mac/target
          key: ${{ runner.os }}-arm64-cargo-release-${{ hashFiles('apps/mac/Cargo.lock', 'apps/mac/rust-toolchain.toml') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        run: apps/mac/scripts/build-app.sh

      - name: Stage the app
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent "apps/mac/dist/omp console.app" "artifacts/omp-console_${VERSION}_macos-arm64.zip"
          ls -l artifacts

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mac/target
          key: ${{ runner.os }}-x64-cargo-release-${{ hashFiles('apps/mac/Cargo.lock', 'apps/mac/rust-toolchain.toml') }}

      - name: Install Tauri CLI
        working-directory: apps/mac
        run: cargo install tauri-cli --locked --version '^2'

      - name: Build Windows installers
        working-directory: apps/mac
        run: cargo tauri build --config tauri.windows.conf.json --bundles nsis,msi

      - name: Stage Windows installers
        shell: bash
        run: |
          mkdir -p artifacts
          for file in apps/mac/target/release/bundle/nsis/*.exe apps/mac/target/release/bundle/msi/*.msi; do
            name=$(basename "$file")
            cp "$file" "artifacts/${name// /-}"
          done
          ls -l artifacts

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Write checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --prerelease --verify-tag \
              --title "omp console $TAG" --notes-file "docs/releases/$TAG.md"
          fi
