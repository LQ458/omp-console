name: Bug report
description: Report a reproducible problem with omp-console.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: >-
        Remove device tokens, pairing codes, cookies, API keys, and private project details from logs and screenshots before submitting.
  - type: input
    id: os
    attributes:
      label: Operating system and version
      description: Include the distribution/version on Linux or macOS version.
      placeholder: Ubuntu 24.04, macOS 15.x
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: CPU architecture
      placeholder: x86_64, arm64
    validations:
      required: true
  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`.
      placeholder: 1.4.3
    validations:
      required: true
  - type: input
    id: omp-version
    attributes:
      label: omp version
      description: Output of `omp --version`.
      placeholder: omp 18.12.6
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - macOS LaunchAgent (`./scripts/install.sh --launchd`)
        - Linux systemd user service (`./scripts/install.sh --systemd`)
        - Foreground/manual
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that reproduces the problem.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include the exact error if available.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all tokens, pairing codes, cookies, API keys, and personal information before pasting.
      render: shell
      placeholder: Paste relevant sanitized terminal or service logs.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Describe the screenshot or attach it after creating the issue. Redact private data first.
      placeholder: What should the screenshot show?
  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, pairing codes and API keys from the logs.
          required: true
