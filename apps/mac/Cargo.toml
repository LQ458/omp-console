[workspace]

[package]
name = "deck-mac"
version = "0.1.0"
description = "Native desktop shell for the omp-console daemon"
authors = ["omp-console"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# tauri-plugin-deep-link 2.6.2's Linux parser omits fields added in rust-ini 0.21.3.
# Keep Cargo.lock at 0.21.1 until the plugin updates its initializer.
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
url = "2"
libc = "0.2"
png = "0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2", "objc2-app-kit", "std"] }
